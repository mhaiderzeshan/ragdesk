<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - RAGDesk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/chat.css">
  <script src="js/config.js"></script>
</head>
<body>

  <div class="chat-layout animate-fade-in">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="brand-mark"><i class="fas fa-layer-group"></i> RAGDesk</h2>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="index.html"><i class="fas fa-home"></i> Dashboard</a>
        </li>
        <li class="nav-item">
          <a href="chat.html" class="active"><i class="fas fa-comments"></i> Chat Interface</a>
        </li>
      </ul>

      <div style="margin-top: 2rem;">
        <label class="form-label" for="kb-select">Knowledge Base</label>
        <select id="kb-select" style="margin-bottom: 1rem;">
          <option value="">Loading...</option>
        </select>
      </div>

      <div style="margin-top: auto;">
        <button id="logout-btn" class="btn btn-secondary" style="width: 100%;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <main class="workspace-shell">
      <section class="chat-container" aria-label="Chat">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Workspace</p>
            <h1 id="chat-title">Ask your knowledge base</h1>
          </div>
          <button id="clear-chat-btn" class="btn-icon header-action" title="Clear chat" aria-label="Clear chat">
            <i class="fas fa-trash-alt"></i>
          </button>
        </header>

        <div id="chat-messages" class="chat-messages">
          <div class="message ai">
            <div class="message-avatar"><i class="fas fa-robot"></i></div>
            <div class="message-content">
              Select a knowledge base, upload a PDF, then ask questions while processing updates appear in artifacts.
            </div>
          </div>
        </div>

        <div class="chat-input-area">
          <form id="chat-form" class="chat-input-wrapper">
            <textarea id="chat-input" class="chat-input" placeholder="Ask a question..." required></textarea>
            <button type="submit" id="send-btn" class="send-btn" title="Send message" aria-label="Send message">
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </section>

      <aside class="artifacts-panel" aria-label="Artifacts">
        <header class="artifacts-header">
          <div>
            <p class="eyebrow">Artifacts</p>
            <h2>Documents</h2>
          </div>
          <button id="refresh-artifacts-btn" class="btn-icon header-action" title="Refresh artifacts" aria-label="Refresh artifacts">
            <i class="fas fa-rotate"></i>
          </button>
        </header>

        <div id="artifact-alert" class="artifact-alert" role="status" aria-live="polite"></div>

        <form id="artifact-upload-form" class="upload-dropzone">
          <input type="file" id="artifact-file-input" accept=".pdf" hidden>
          <button type="button" id="artifact-file-button" class="upload-picker">
            <i class="fas fa-file-arrow-up"></i>
          </button>
          <div class="upload-copy">
            <strong id="selected-file-label">Upload PDF</strong>
            <span id="upload-hint">Choose a file for the selected knowledge base.</span>
          </div>
          <button type="submit" id="artifact-upload-btn" class="btn btn-primary upload-submit" disabled>
            <i class="fas fa-cloud-arrow-up"></i> Upload
          </button>
        </form>

        <div id="artifacts-list" class="artifacts-list">
          <div class="artifact-empty">
            <i class="fas fa-folder-open"></i>
            <span>No artifacts yet.</span>
          </div>
        </div>
      </aside>
    </main>

  </div>

  <script type="module" src="js/chat.js"></script>
</body>
</html>
