<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - RAGDesk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <div class="dashboard-layout animate-fade-in">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2 class="text-gradient"><i class="fas fa-layer-group"></i> RAGDesk</h2>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="index.html" class="active"><i class="fas fa-home"></i> Dashboard</a>
        </li>
        <li class="nav-item">
          <a href="chat.html"><i class="fas fa-comments"></i> Chat Interface</a>
        </li>
      </ul>
      <div style="margin-top: auto;">
        <button id="logout-btn" class="btn btn-secondary" style="width: 100%;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1>Knowledge Bases</h1>
          <p style="color: var(--text-muted)">Manage your document collections and upload new files.</p>
        </div>
        <button id="new-kb-btn" class="btn btn-primary">
          <i class="fas fa-plus"></i> New Knowledge Base
        </button>
      </header>

      <div id="dashboard-alert-container"></div>

      <div id="kb-grid" class="grid-cards">
        <!-- Knowledge Bases will be injected here -->
        <div class="glass-panel card" style="display: flex; align-items: center; justify-content: center; height: 150px; opacity: 0.5;">
          <p>Loading...</p>
        </div>
      </div>
    </main>

  </div>

  <!-- New KB Modal -->
  <div id="kb-modal" class="modal-overlay">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <h3>Create Knowledge Base</h3>
        <button class="modal-close" id="close-modal"><i class="fas fa-times"></i></button>
      </div>
      <form id="kb-form">
        <div class="form-group">
          <label class="form-label" for="kb-name">Knowledge Base Name</label>
          <input type="text" id="kb-name" placeholder="e.g. HR Policies" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="kb-desc">Description (optional)</label>
          <textarea id="kb-desc" rows="3" placeholder="Brief description..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
